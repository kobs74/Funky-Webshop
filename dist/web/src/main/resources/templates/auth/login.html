<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{general}">
<head>
    <title>Login - KeyScout24</title>
</head>
<body>
<th:block layout:fragment="content">
    <section class="auth-section">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card card">
                    <div class="card-body">
                        <div class="auth-header">
                            <h1 class="auth-title">Welcome Back</h1>
                            <p class="text-secondary">Login to your KeyScout24 account</p>
                        </div>

                        <form method="POST" action="/login" class="auth-form">
                            <div class="form-group">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" name="username" class="form-control"
                                       placeholder="Enter your username" required>
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" name="password" class="form-control"
                                       placeholder="Enter your password" required>
                            </div>

                            <div class="form-group">
                                <div class="d-flex justify-between align-center">
                                    <label class="checkbox-label">
                                        <input type="checkbox" name="remember_me">
                                        <span class="ml-1">Remember me</span>
                                    </label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block btn-lg">
                                Login
                            </button>
                        </form>

                        <div class="auth-footer">
                            <p class="text-center text-secondary">
                                Don't have an account?
                                <a href="/register" class="text-primary font-semibold">Sign up
                                    here</a>
                            </p>
                        </div>
                    </div>
                </div>


            </div>
        </div>
    </section>

    <style>
        .auth-section {
            flex: 1;
            padding: var(--spacing-3xl) 0;
            display: flex;
            align-items: center;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .auth-card {
            width: 100%;
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .auth-title {
            color: var(--color-primary);
            margin-bottom: var(--spacing-sm);
        }

        .auth-form {
            margin-bottom: var(--spacing-xl);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: var(--color-text-secondary);
        }

        .checkbox-label input[type="checkbox"] {
            cursor: pointer;
            margin-right: var(--spacing-xs);
        }

        .auth-footer {
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--color-border);
        }
    </style>
</th:block>
</body>
</html>
