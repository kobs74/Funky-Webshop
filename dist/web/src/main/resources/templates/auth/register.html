<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{general}">
<head>
    <title>Sign Up - KeyScout24</title>
</head>
<body>
<th:block layout:fragment="content">
    <section class="auth-section">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card card">
                    <div class="card-body">
                        <div class="auth-header">
                            <h1 class="auth-title">Join KeyScout24</h1>
                            <p class="text-secondary">Create your account and start gaming</p>
                        </div>

                        <form method="POST" action="/register" class="auth-form">
                            <div class="form-group">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" name="username" class="form-control"
                                       placeholder="Choose a username" required>
                            </div>

                            <div class="form-group">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" name="password" class="form-control"
                                       placeholder="Create a strong password" required minlength="8">
                                <small class="form-text">
                                    Password must be at least 8 characters long
                                </small>
                            </div>

                            <div class="form-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" name="accept_terms" required>
                                    <span class="ml-1">
                                    I agree to the <a href="#" class="text-primary">Terms of Service</a>
                                    and <a href="#" class="text-primary">Privacy Policy</a>
                                </span>
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block btn-lg">
                                Create Account
                            </button>
                        </form>

                        <div class="auth-footer">
                            <p class="text-center text-secondary">
                                Already have an account?
                                <a href="/login" class="text-primary font-semibold">Login here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <style>
        .auth-section {
            flex: 1;
            padding: var(--spacing-3xl) 0;
            display: flex;
            align-items: center;
        }

        .auth-container {
            display: flex;
            justify-content: center;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .auth-card {
            width: 100%;
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .auth-title {
            color: var(--color-primary);
            margin-bottom: var(--spacing-sm);
        }

        .auth-form {
            margin-bottom: var(--spacing-xl);
        }

        .checkbox-label {
            display: flex;
            align-items: start;
            cursor: pointer;
            color: var(--color-text-secondary);
            line-height: 1.5;
        }

        .checkbox-label input[type="checkbox"] {
            cursor: pointer;
            margin-top: 4px;
            margin-right: var(--spacing-xs);
        }

        .auth-footer {
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--color-border);
        }

        .form-text {
            display: block;
            margin-top: var(--spacing-xs);
            color: var(--color-text-muted);
            font-size: var(--font-size-sm);
        }
    </style>
</th:block>
</body>
</html>
