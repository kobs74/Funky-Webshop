<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{general}">
<head>
    <title>500 - Server Error - KeyScout24</title>
</head>
<body>
<th:block layout:fragment="content">
    <section class="error-section">
        <div class="container">
            <div class="error-content">
                <div class="error-icon">⚠️</div>
                <h1 class="error-code">500</h1>
                <h2 class="error-title">Internal Server Error</h2>
                <p class="error-message">Oops! Something went wrong on our end. Our team has been notified and is
                    working to fix the issue.</p>
                <div class="error-actions">
                    <a href="/" class="btn btn-primary btn-lg">Go Home</a>
                    <a href="/game/list" class="btn btn-outline-primary btn-lg">Browse Games</a>
                </div>
            </div>
        </div>
    </section>

    <style>
        .error-section {
            min-height: calc(100vh - 250px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-dark);
            padding: var(--spacing-3xl) 0;
        }

        .error-content {
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .error-icon {
            font-size: 6rem;
            margin-bottom: var(--spacing-lg);
            opacity: 0.5;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 0.8;
            }
        }

        .error-code {
            font-size: 8rem;
            font-weight: var(--font-weight-bold);
            background: linear-gradient(135deg, var(--color-error) 0%, var(--color-error-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            line-height: 1;
        }

        .error-title {
            font-size: var(--font-size-3xl);
            color: var(--color-text-primary);
            margin: var(--spacing-lg) 0 var(--spacing-md) 0;
            font-weight: var(--font-weight-bold);
        }

        .error-message {
            font-size: var(--font-size-lg);
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-2xl);
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }

            .error-title {
                font-size: var(--font-size-2xl);
            }

            .error-message {
                font-size: var(--font-size-base);
            }

            .error-icon {
                font-size: 4rem;
            }

            .error-actions {
                flex-direction: column;
            }

            .error-actions .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 4rem;
            }

            .error-title {
                font-size: var(--font-size-xl);
            }

            .error-icon {
                font-size: 3rem;
            }
        }
    </style>
</th:block>
</body>
</html>
