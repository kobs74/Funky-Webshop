<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{general}">
<head>
    <title>Add New Game - KeyScout24</title>
</head>
<body>
<th:block layout:fragment="content">
    <section class="form-header">
        <div class="container">
            <h1 class="header-title">Add New Game</h1>
            <p class="header-subtitle">List your game key for sale</p>
        </div>
    </section>

    <section class="form-section">
        <div class="container">
            <div class="form-container">
                <form method="POST" action="/game/add" class="game-form">
                    <div class="form-group">
                        <label for="name" class="form-label">Game Name *</label>
                        <input
                                type="text"
                                id="name"
                                name="name"
                                class="form-control"
                                placeholder="e.g., Cyberpunk 2077"
                                maxlength="40"
                                required
                                th:value="${form['name']}"
                        >
                    </div>

                    <div class="form-group">
                        <label for="description" class="form-label">Description</label>
                        <textarea
                                id="description"
                                name="description"
                                class="form-control"
                                rows="4"
                                placeholder="Optional description of the game or key..."
                                maxlength="255"
                        >[[${form['description']}]]</textarea>
                        <small class="form-text">Maximum 255 characters</small>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="platform" class="form-label">Platform *</label>
                            <select id="platform" name="platform" class="form-control" required>
                                <option value="">Select platform...</option>
                                <option value="PC" th:selected="${form['platform'] == 'PC'}">PC
                                </option>
                                <option value="PlayStation 5"
                                        th:selected="${form['platform'] == 'PlayStation 5'}">
                                    PlayStation 5
                                </option>
                                <option value="PlayStation 4"
                                        th:selected="${form['platform'] == 'PlayStation 4'}">
                                    PlayStation 4
                                </option>
                                <option value="Xbox Series X/S"
                                        th:selected="${form['platform'] == 'Xbox Series X/S'}">
                                    Xbox Series X/S
                                </option>
                                <option value="Xbox One"
                                        th:selected="${form['platform'] == 'Xbox One'}">Xbox One
                                </option>
                                <option value="Nintendo Switch"
                                        th:selected="${form['platform'] == 'Nintendo Switch'}">
                                    Nintendo Switch
                                </option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="store" class="form-label">Store *</label>
                            <select id="store" name="store" class="form-control" required>
                                <option value="">Select store...</option>
                                <option value="Steam" th:selected="${form['store'] == 'Steam'}">
                                    Steam
                                </option>
                                <option value="Epic Games"
                                        th:selected="${form['store'] == 'Epic Games'}">Epic Games
                                </option>
                                <option value="GOG" th:selected="${form['store'] == 'GOG'}">GOG
                                </option>
                                <option value="Origin"
                                        th:selected="${form['store'] == 'Origin'}">Origin
                                </option>
                                <option value="Ubisoft Connect"
                                        th:selected="${form['store'] == 'Ubisoft Connect'}">
                                    Ubisoft Connect
                                </option>
                                <option value="PlayStation Store"
                                        th:selected="${form['store'] == 'PlayStation Store'}">
                                    PlayStation Store
                                </option>
                                <option value="Xbox Store"
                                        th:selected="${form['store'] == 'Xbox Store'}">Xbox Store
                                </option>
                                <option value="Nintendo eShop"
                                        th:selected="${form['store'] == 'Nintendo eShop'}">
                                    Nintendo eShop
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="key" class="form-label">Game Key *</label>
                        <input
                                type="text"
                                id="key"
                                name="key"
                                class="form-control font-mono"
                                placeholder="XXXXX-XXXXX-XXXXX"
                                maxlength="40"
                                required
                                th:value="${form['key']}"
                        >
                        <small class="form-text">Enter the activation key for this game</small>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="price" class="form-label">Price (USD) *</label>
                            <input
                                    type="number"
                                    id="price"
                                    name="price"
                                    class="form-control"
                                    placeholder="19.99"
                                    step="0.01"
                                    min="0"
                                    max="10000"
                                    required
                                    th:value="${form['price']}"
                            >
                        </div>

                        <div class="form-group">
                            <label class="form-label">Special Offer</label>
                            <div class="form-check">
                                <input
                                        type="checkbox"
                                        id="discount"
                                        name="discount"
                                        class="form-check-input"
                                        th:checked="${form['discount'] != null}"
                                >
                                <label for="discount" class="form-check-label">
                                    Mark as discounted/on sale
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="/game/list" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Add Game</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <style>
        .form-header {
            background: var(--gradient-dark);
            padding: var(--spacing-2xl) 0;
            text-align: center;
            border-bottom: 1px solid var(--color-border);
        }

        .header-title {
            font-size: var(--font-size-3xl);
            margin-bottom: var(--spacing-sm);
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: var(--font-weight-bold);
        }

        .header-subtitle {
            color: var(--color-text-secondary);
            font-size: var(--font-size-lg);
        }

        .form-section {
            padding: var(--spacing-2xl) 0;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
        }

        .game-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .form-label {
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-primary);
            font-size: var(--font-size-sm);
        }

        .form-control {
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            font-size: var(--font-size-base);
            transition: all 0.2s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.1);
        }

        .form-control::placeholder {
            color: var(--color-text-secondary);
        }

        textarea.form-control {
            resize: vertical;
            font-family: inherit;
        }

        .form-text {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-lg);
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) 0;
        }

        .form-check-input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .form-check-label {
            cursor: pointer;
            color: var(--color-text-primary);
            font-size: var(--font-size-base);
        }

        .form-actions {
            display: flex;
            gap: var(--spacing-md);
            justify-content: flex-end;
            margin-top: var(--spacing-lg);
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--color-border);
        }

        .font-mono {
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .form-container {
                padding: var(--spacing-lg);
            }

            .form-actions {
                flex-direction: column-reverse;
            }

            .form-actions .btn {
                width: 100%;
            }
        }
    </style>
</th:block>
</body>
</html>
