services:
  postgres:
    image: postgres:18.1-alpine3.22
    restart: unless-stopped

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: dbuser
      POSTGRES_DB: vulndb
      POSTGRES_PASSWORD: superSecret

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dbuser -d vulndb" ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
